# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

target-version = "py313"
line-length = 88

exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    # Experimental / archived — not linted
    "basics/",
    "misc/",
    "notebook/",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PIE",    # flake8-pie
    "PERF",   # perflint
    "PL",     # pylint
    "TRY",    # tryceratops
]

ignore = [
    "E501",    # line too long (formatter handles this)
    "B008",    # function calls in argument defaults (FastAPI Depends pattern)
    "B905",    # zip without explicit strict
    "TRY003",  # long exception messages are fine
    "PLR0913", # too many arguments — common in async pipelines
    # ── Opinionated style rules disabled project-wide ──────────────────────
    "PLC0415", # import-outside-top-level: intentional for optional/lazy deps
    "PLW0603", # global-statement: used for module-level singleton caches
    "PLW2901", # redefined-loop-name: common and readable pattern
    "PERF401", # manual-list-comprehension: readability over micro-perf
    "TRY300",  # try-consider-else: adds nesting without benefit here
    "TRY400",  # error-instead-of-exception: fine in structured-log context
    "TRY401",  # verbose-log-message: explicit is clearer in async pipelines
    "B017",    # assert-raises-exception: fine in tests (bare Exception is clear)
    "B904",    # raise-without-from: HTTPException chains are intentionally detached
    "RUF006",  # asyncio-dangling-task: fire-and-forget is intentional here
    "PLR2004", # magic-value-comparison: numeric literals in comparisons are clear
    "TC001",   # typing-only-import: unnecessary complexity for small codebase
    "UP046",   # non-pep695-generic: Generic[] is compatible with Python < 3.12
    "TRY201",  # verbose-raise: explicit re-raise is clearer
    "TRY301",  # raise-within-try: restructuring adds complexity without benefit
    "B007",    # unused-loop-variable: _ convention conflicts with gettext idiom
    "SIM105",  # suppressible-exception: explicit try/except is more readable
    "SIM117",  # multiple-with-statements: readability preference
    "C408",    # unnecessary-dict-call: dict() is explicit about intent
]

fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["rag", "kg", "nl2sql", "knowledge"]

[lint.per-file-ignores]
# Tests: assert is fine, magic values are fine, local imports for isolation are fine
"tests/**"        = ["S101", "PLR2004", "PLC0415"]
"rag/v2/tests/**" = ["S101", "PLR2004", "PLC0415"]
# Seed / dev scripts: local imports are intentional (optional heavy deps)
"scripts/**" = ["PLC0415"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
