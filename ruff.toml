# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

target-version = "py313"
line-length = 88

exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    # Experimental / archived — not linted
    "basics/",
    "misc/",
    "notebook/",
]

[lint]
# Base rules — apply to rag/ and legacy code
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # line too long (formatter handles this)
    "B008",   # function calls in argument defaults (FastAPI Depends pattern)
    "B905",   # zip without explicit strict
]

fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["rag", "kg", "nl2sql", "knowledge"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Stricter rules for backend/knowledge/ (RAG v2) ───────────────────────────
[lint.per-file-ignores]
# Tests: allow assert statements and magic values
"backend/knowledge/tests/**" = ["S101", "PLR2004"]

[[lint.extend-per-file-ignores]]
# Apply additional rule sets only to the v2 module
files = ["backend/knowledge/**/*.py"]
extend-select = [
    "SIM",    # flake8-simplify: simplifiable conditions / returns
    "TCH",    # flake8-type-checking: move typing-only imports into TYPE_CHECKING
    "PIE",    # flake8-pie: misc cleanups (unnecessary pass, prefer list literal, etc.)
    "PERF",   # perflint: avoid unnecessary list/dict/set casts in loops
    "PL",     # pylint rules (subset Ruff supports)
    "TRY",    # tryceratops: exception handling hygiene
]
extend-ignore = [
    "TRY003", # long exception messages are fine
    "PLR0913",# too many arguments — common in async pipelines
]
