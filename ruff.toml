# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

target-version = "py313"
line-length = 88

exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    # Experimental / archived — not linted
    "basics/",
    "misc/",
    "notebook/",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PIE",    # flake8-pie
    "PERF",   # perflint
    "PL",     # pylint
    "TRY",    # tryceratops
]

ignore = [
    "E501",    # line too long (formatter handles this)
    "B008",    # function calls in argument defaults (FastAPI Depends pattern)
    "B905",    # zip without explicit strict
    "TRY003",  # long exception messages are fine
    "PLR0913", # too many arguments — common in async pipelines
]

fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["rag", "kg", "nl2sql", "knowledge"]

[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"rag/v2/tests/**" = ["S101", "PLR2004"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
