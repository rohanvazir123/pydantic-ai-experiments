[project]
name = "rag-agent"
version = "0.1.0"
description = "Agentic RAG system with PostgreSQL pgvector"
requires-python = ">=3.13"
dependencies = [
    # Core runtime — always needed
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic-ai>=0.1.0",
    "openai>=1.58.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Document ingestion pipeline (Docling + HuggingFace tokenizer)
ingestion = [
    "docling>=2.14.0",
    "docling-core>=2.4.0",
    "transformers>=4.47.0",
]
# Audio transcription — also requires FFmpeg in PATH
audio = [
    "openai-whisper>=20240930",
]
# Streamlit chat UI
ui = [
    "streamlit>=1.40.0",
]
# Langfuse tracing / observability
observability = [
    "langfuse>=2.0.0",
]
# MCP server (FastMCP, stdio transport)
mcp = [
    "mcp>=1.0.0",
]
# Cross-encoder reranker (BAAI/bge-reranker-base or ms-marco variants)
reranker = [
    "sentence-transformers>=3.0.0",
]
# Mem0 user-memory layer (pgvector-backed)
mem0 = [
    "mem0ai>=0.1.0",
]
# NL-to-SQL query parsing
nl2sql = [
    "sqlglot>=25.0.0",
]
# Everything — recommended for development
all = [
    "rag-agent[ingestion,audio,ui,observability,mcp,reranker,mem0,nl2sql]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "kg", "nl2sql"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: requires live PostgreSQL + AGE + Ollama (deselect with -m 'not integration')",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "types-redis>=4.6.0",
    "types-aiofiles>=24.1.0",
    "types-PyYAML>=6.0.0",
]

# ── mypy ──────────────────────────────────────────────────────────────────────
# Strict only for backend/knowledge/ — everything else is ignored or permissive.
# Run with: mypy backend/knowledge/
[tool.mypy]
python_version = "3.13"
explicit_package_bases = true   # resolves backend/knowledge/ as "knowledge" package
mypy_path = "backend"           # so `import knowledge.x` resolves correctly

# Defaults for anything not covered by an override — permissive for legacy code
ignore_missing_imports = true
follow_imports = "silent"

# Strict block for the v2 module
[[tool.mypy.overrides]]
module = "knowledge.*"
# Annotation completeness
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
# No silent Any leakage
warn_return_any = true
no_implicit_optional = true
# Keeps # type: ignore honest — errors if the ignore is no longer needed
warn_unused_ignores = true
# Misc correctness
strict_equality = true
extra_checks = true
# Don't require explicit Any — too noisy at the start; revisit after first pass
disallow_any_generics = false

# Third-party stubs we don't have — silence rather than error
[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "pgvector.*",
    "docling.*",
    "langfuse.*",
    "sentence_transformers.*",
    "mem0.*",
    "APScheduler.*",
    "apscheduler.*",
    "croniter.*",
    "joserfc.*",
    "msgpack.*",
    "prometheus_client.*",
    "slowapi.*",
    "whisper.*",
]
ignore_missing_imports = true
