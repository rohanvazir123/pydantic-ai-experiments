name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag/v2

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragv2_test
          POSTGRES_USER: ragv2
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'rag/v2/uv.lock'

      - name: Install dependencies
        # Exclude --extra reranker (sentence-transformers/torch ≈ 2 GB) — the
        # reranker is optional and degrades gracefully when not installed.
        run: uv sync --extra ingestion --extra observability

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Smoke tests (no services, <2 s)
        env:
          DATABASE_URL:     postgresql://ragv2:test@localhost:5432/ragv2_test
          AGE_DATABASE_URL: postgresql://ragv2:test@localhost:5432/ragv2_test
          REDIS_URL:        redis://localhost:6379/1
        run: uv run pytest tests/unit/test_smoke.py -v --tb=short -q

      - name: Unit tests
        env:
          DATABASE_URL:     postgresql://ragv2:test@localhost:5432/ragv2_test
          AGE_DATABASE_URL: postgresql://ragv2:test@localhost:5432/ragv2_test
          REDIS_URL:        redis://localhost:6379/1
        run: uv run pytest tests/unit/ tests/retrieval/test_retrieval_metrics.py::TestMetricFunctions -v --tb=short -q

      - name: Apply database schemas
        env:
          DATABASE_URL: postgresql://ragv2:test@localhost:5432/ragv2_test
        # Use asyncpg directly — no system psql client needed.
        run: |
          uv run python - <<'PYEOF'
          import asyncio, asyncpg, glob, os, sys

          async def main() -> None:
              conn = await asyncpg.connect(os.environ["DATABASE_URL"])
              files = sorted(glob.glob("schema/*.sql"))
              if not files:
                  print("No migration files found", file=sys.stderr)
                  sys.exit(1)
              for path in files:
                  sql = open(path).read()
                  await conn.execute(sql)
                  print(f"  applied {path}")
              await conn.close()
              print(f"Done — {len(files)} migrations applied.")

          asyncio.run(main())
          PYEOF

      - name: Integration tests (DB layer)
        env:
          DATABASE_URL:     postgresql://ragv2:test@localhost:5432/ragv2_test
          AGE_DATABASE_URL: postgresql://ragv2:test@localhost:5432/ragv2_test
          REDIS_URL:        redis://localhost:6379/1
        run: uv run pytest tests/integration/ -v --tb=short -q -m "not agent"

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: rag/v2
          target: api
          push: false
          tags: knowledge-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build ingest-worker image
        uses: docker/build-push-action@v6
        with:
          context: rag/v2
          target: ingest-worker
          push: false
          tags: knowledge-ingest-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build retrieval-worker image
        uses: docker/build-push-action@v6
        with:
          context: rag/v2
          target: retrieval-worker
          push: false
          tags: knowledge-retrieval-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag/v2/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rag/v2/frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck 2>/dev/null || true   # non-blocking until types are complete

      - name: Build
        run: npm run build
        env:
          # Silence Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: '1'
          # Prevent build from failing on missing runtime env vars
          NODE_ENV: production
